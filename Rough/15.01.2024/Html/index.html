<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>BBC NEWS</h2>
        <nav>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <form action="">
        <div>
            <label for="country">Country:</label>
            <select name="country" id="country" required>
                <option value="us">United states</option>
                <option value="india">India</option>
                <option value="uk">United Kingdom</option>
            </select>
        </div>

        <div>
            <label for="comment">Comment:</label>
            <textarea name="comment" id="comment" rows="4" cols="60" placeholder="Type here..." required></textarea>
        </div>

        <table border="1" style="border-collapse: collapse; width: 100%;background-color: rgb(206, 210, 213);">
            <caption>Student Grades</caption>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Sanjay</td>
                    <td>Maths</td>
                    <td>B</td>
                </tr>
                <tr>
                    <td>Gokul</td>
                    <td>Maths</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Martin</td>
                    <td>Maths</td>
                    <td>C</td>
                </tr>
            </tbody>3o9-
        </table>

        <footer>
            <div>
                <label for="">
                    <input type="checkbox" value="yes" name="terms" required>Agree, all terms and conditions,
                    <input type="checkbox" value="no" name="terms">Disagree, all terms and conditions,
                </label>
            </div>
        </footer>

        <input type="submit" name="" id="" value="Send Message">
    </form>
    <div style="text-align: center;">
        <div class="container">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
        </div>
    </div>
    
</body>

</html>
